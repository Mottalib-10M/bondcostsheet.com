name: Bond amounts check and deploy

# Le 1er de chaque mois vers 8 h (heure de l'Est) : scripts/update-data.py relit chaque page officielle
# (lois, agences, DMV, eCFR) et vérifie que le montant de la caution y figure encore. Un montant introuvable
# fait échouer le job (le script ne réécrit jamais un montant seul : une personne relit la page et corrige
# data/facts). data/verification.json garde la date et le résultat de chaque relecture.
on:
  schedule:
    - cron: "0 12 1 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          pip install pypdf

      - name: Reread the official pages (scheduled and manual runs)
        if: github.event_name != 'push'
        run: python3 scripts/update-data.py

      - name: Rebuild the data table
        run: python3 scripts/build-data.py

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit the verification dates
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification.json src/data/bonds.json
          git diff --cached --quiet || (git commit -m "Montants des cautions relus le $(date -u +%F)" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
